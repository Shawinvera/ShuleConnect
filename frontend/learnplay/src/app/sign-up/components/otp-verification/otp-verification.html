<app-spinner-overlay *ngIf="isSubmitting"></app-spinner-overlay>
<app-toast [message]="toast.message" [type]="toast.type" [visible]="toast.visible" (dismissed)="toast.dismiss()"></app-toast>
<div class="h-screen overflow-hidden bg-gradient-to-b from-[#F5F5FF] to-[#FBF4FC] w-full flex items-center justify-center px-4 sm:px-8 md:px-12 lg:px-0">
  <div class="w-full max-w-[520px] mx-auto flex flex-col gap-[20px]">
    <div class="w-full p-[16px] md:p-[30px] lg:pt-[50px] lg:pr-[40px] lg:pb-[50px] lg:pl-[40px] flex flex-col gap-[20px] md:gap-[30px] rounded-[15px] md:rounded-[20px] lg:rounded-[23px] bg-white shadow-[0px_6px_30px_0px_#0000001A]">

      <!-- Header -->
      <div class="w-full flex items-center flex-col gap-[6px] md:gap-[10px]">
        <div class="w-[60px] h-[60px] md:w-[90px] md:h-[90px] lg:w-[100px] lg:h-[100px] rounded-full bg-gradient-to-b from-[#FAB315] to-[#F98816] shadow-[0px_10px_25px_0px_#00000026] overflow-hidden">
          <img src="./assets/icons/logo.png" class="w-full h-full object-cover">
        </div>
        <div class="w-full flex flex-col gap-[2px] text-center">
          <span class="font-fredoka font-bold text-[26px] md:text-[38px] lg:text-[45px] leading-[30px] md:leading-[50px] lg:leading-[64px] tracking-[-0.4px] text-[#9333EA]">Verify Account</span>
          <span class="font-fredoka font-normal text-[14px] md:text-[18px] lg:text-[20px] leading-[18px] md:leading-[32px] tracking-[-0.4px] text-[#374151]">
            {{ isEmail ? 'Enter the 4-digit OTP sent to your email' : 'Enter the 4-digit OTP sent to your phone' }}
          </span>
        </div>
      </div>

      <!-- Error -->
      <div *ngIf="errorMessage" class="w-full px-[16px] py-[10px] bg-red-50 border-[2px] border-red-300 rounded-[12px]">
        <span class="font-fredoka font-medium text-[14px] md:text-[18px] leading-[18px] text-red-600">{{ errorMessage }}</span>
      </div>

      <!-- Hidden real input that captures keystrokes -->
      <input
        #hiddenInput
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        (keydown)="onKeydown($event)"
        class="absolute opacity-0 w-0 h-0 pointer-events-none"
      />

      <!-- 4 display boxes — clicking any box focuses the hidden input -->
      <div class="flex justify-center gap-[12px] md:gap-[16px]" (click)="focusHidden()">
        <div
          *ngFor="let digit of digits; let i = index"
          class="w-[60px] h-[70px] md:w-[80px] md:h-[90px] flex items-center justify-center bg-white border-[2px] rounded-[12px] md:rounded-[16px] font-fredoka font-bold text-[28px] md:text-[36px] text-[#374151] cursor-text select-none relative"
          [class.border-purple-500]="i === activeIndex"
          [class.border-[#E5E7EB]]="i !== activeIndex"
        >
          {{ digit }}
          <!-- Blinking cursor for active field -->
          <div 
            *ngIf="i === activeIndex && digit === ''" 
            class="absolute w-[2px] h-[30px] md:h-[36px] bg-purple-500 animate-pulse"
          ></div>
        </div>
      </div>

      <!-- Timer Display (appears where resend button will be) -->
      <div *ngIf="!canResend" class="flex justify-center mb-[16px] md:mb-[20px]">
        <div class="flex flex-col items-center gap-[8px]">
          <span class="font-fredoka font-normal text-[14px] md:text-[16px] lg:text-[18px] text-[#6B7280]">
            Didn't receive the code?
          </span>
          <span class="font-fredoka font-medium text-[14px] md:text-[16px] lg:text-[18px] text-[#9333EA]">
            Resend OTP in {{ resendTimer }} seconds
          </span>
        </div>
      </div>

      <!-- Action Buttons Row -->
      <div class="flex flex-row gap-[12px] sm:gap-[16px] md:gap-[20px] w-full">
        <!-- Resend OTP Button (Left) -->
        <button
          (click)="onResendOTP()"
          [disabled]="!canResend || isSubmitting"
          class="flex-1 h-[48px] md:h-[52px] lg:h-[56px] rounded-[12px] md:rounded-[14px] lg:rounded-[16px] font-fredoka font-bold text-[14px] sm:text-[16px] md:text-[18px] lg:text-[20px] text-white transition-all duration-300 ease-in-out flex items-center justify-center gap-[6px] sm:gap-[8px]"
          [class]="canResend && !isSubmitting 
            ? 'bg-gradient-to-r from-[#667DE8] to-[#754DA5] hover:from-[#5A6FD8] hover:to-[#6A4495] hover:shadow-[0_8px_25px_0_rgba(117,77,165,0.35)] cursor-pointer' 
            : 'bg-gradient-to-r from-[#9CA3AF] to-[#9CA3AF] cursor-not-allowed'"
        >
          <div class="w-[24px] h-[24px] sm:w-[28px] sm:h-[28px] bg-white/20 rounded-full flex items-center justify-center">
            <img 
              *ngIf="!isSubmitting" 
              src="./assets/icons/otp.png" 
              class="w-[14px] h-[14px] sm:w-[16px] sm:h-[16px] brightness-0 invert"
              alt="Resend OTP"
            />
            <div *ngIf="isSubmitting" class="w-[14px] h-[14px] sm:w-[16px] sm:h-[16px] border-2 border-white border-t-transparent rounded-full animate-spin"></div>
          </div>
          <span class="hidden xs:inline sm:inline">{{ isSubmitting ? 'Sending...' : 'Resend OTP' }}</span>
          <span class="xs:hidden sm:hidden">{{ isSubmitting ? 'Send' : 'Resend' }}</span>
        </button>

        <!-- Clear/Back Button (Right) -->
        <button
          (click)="onBackToSignUp()"
          [disabled]="isSubmitting"
          class="flex-1 h-[48px] md:h-[52px] lg:h-[56px] bg-gradient-to-r from-[#667DE8] to-[#754DA5] hover:from-[#5A6FD8] hover:to-[#6A4495] disabled:from-[#9CA3AF] disabled:to-[#9CA3AF] rounded-[12px] md:rounded-[14px] lg:rounded-[16px] font-fredoka font-bold text-[14px] sm:text-[16px] md:text-[18px] lg:text-[20px] text-white transition-all duration-300 ease-in-out hover:shadow-[0_8px_25px_0_rgba(117,77,165,0.35)] disabled:cursor-not-allowed disabled:shadow-none flex items-center justify-center gap-[6px] sm:gap-[8px]"
        >
          <div class="w-[24px] h-[24px] sm:w-[28px] sm:h-[28px] bg-white/20 rounded-full flex items-center justify-center">
            <img 
              src="./assets/icons/add-user.png" 
              class="w-[14px] h-[14px] sm:w-[16px] sm:h-[16px] brightness-0 invert"
              alt="Back to Sign Up"
            />
          </div>
          <span class="hidden xs:inline sm:inline">Sign Up page</span>
          <span class="xs:hidden sm:hidden">Sign Up</span>
        </button>
      </div>

    </div>
  </div>
</div>
