<div *ngIf="crumbs.length > 1" class="breadcrumb-row">
  <button *ngIf="canGoBack" class="back-btn" (click)="goBack()" aria-label="Go back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    <span>Back</span>
  </button>
  <span *ngIf="canGoBack" class="breadcrumb-divider"></span>
  <ol class="kid-breadcrumb-list">
    <li *ngFor="let crumb of crumbs; let i = index; let last = last" class="kid-breadcrumb-item">
      <span
        [class.kid-breadcrumb-link]="!last"
        [class.kid-breadcrumb-current]="last"
        (click)="navigate(crumb, i)"
      >{{ crumb.label }}</span>
      <span *ngIf="!last" class="kid-breadcrumb-sep">›</span>
    </li>
  </ol>
</div>
