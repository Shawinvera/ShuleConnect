<div class="relative w-full">
  <div class="flex gap-2 w-full items-stretch">

    <!-- Country code trigger button -->
    <button type="button" (click)="toggleDropdown()"
      class="h-[42px] md:h-[70px] lg:h-[79px] px-[10px] md:px-[14px] bg-white border-[2px] border-[#E5E7EB] rounded-[12px] md:rounded-[18px] lg:rounded-[20px] focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent font-fredoka font-medium text-[13px] md:text-[18px] lg:text-[20px] tracking-[-0.4px] text-[#374151] w-[110px] md:w-[150px] lg:w-[170px] shrink-0 flex items-center justify-between gap-1 transition-all duration-200"
      [class.border-[#9333EA]]="isOpen"
      [class.ring-2]="isOpen"
      [class.ring-purple-500]="isOpen">
      <span *ngIf="!isLoading" class="truncate">{{ selected.code }}</span>
      <span *ngIf="isLoading" class="text-[#BBC2CD]">...</span>
      <svg class="w-4 h-4 shrink-0 text-[#BBC2CD] transition-transform duration-200"
        [class.rotate-180]="isOpen"
        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>

    <!-- Phone number input — native (input) event strips non-digits immediately -->
    <input
      #phoneInput
      type="tel"
      inputmode="numeric"
      [value]="phoneNumber"
      (input)="onNativeInput($event)"
      (blur)="onBlur()"
      [placeholder]="placeholder"
      maxlength="10"
      autocomplete="off"
      class="flex-1 min-w-0 h-[42px] md:h-[70px] lg:h-[79px] px-[14px] md:px-[18px] lg:px-[20px] bg-white border-[2px] rounded-[12px] md:rounded-[18px] lg:rounded-[20px] focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent font-fredoka font-medium text-[14px] md:text-[20px] lg:text-[23px] tracking-[-0.4px] text-[#374151] placeholder:text-[#BBC2CD]"
      [class.border-red-400]="phoneError"
      [class.border-green-400]="!phoneError && isValid"
      [class.border-[#E5E7EB]]="!phoneError && !isValid" />
  </div>

  <!-- Validation message -->
  <span *ngIf="phoneError" class="font-fredoka text-red-500 text-[11px] md:text-[14px] flex items-center gap-1 mt-1">
    ✗ {{ phoneError }}
  </span>

  <!-- Dropdown panel -->
  <div *ngIf="isOpen"
    class="absolute top-full left-0 mt-2 w-full z-[200] bg-white rounded-[16px] shadow-[0_8px_30px_rgba(0,0,0,0.12)] border-[2px] border-[#E5E7EB] overflow-hidden">

    <!-- Search -->
    <div class="p-3 border-b border-[#E5E7EB]">
      <div class="relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[#BBC2CD]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
        </svg>
        <input type="text" [(ngModel)]="search" (ngModelChange)="onSearch()"
          placeholder="Search country..."
          class="w-full h-[38px] pl-9 pr-3 bg-[#F5F5FF] border-[2px] border-transparent rounded-[10px] focus:outline-none focus:border-[#9333EA] font-fredoka font-medium text-[13px] md:text-[15px] tracking-[-0.3px] text-[#374151] placeholder:text-[#BBC2CD]" />
      </div>
    </div>

    <!-- List -->
    <div class="overflow-y-auto max-h-[220px] scrollbar-hide">
      <div *ngIf="isLoading" class="flex items-center justify-center py-8">
        <div class="w-6 h-6 border-[3px] border-[#E5E7EB] border-t-[#9333EA] rounded-full animate-spin"></div>
      </div>
      <div *ngIf="!isLoading && filtered.length === 0" class="px-4 py-6 text-center font-fredoka text-[14px] text-[#BBC2CD]">
        No countries found
      </div>
      <button *ngFor="let c of filtered" type="button" (click)="selectCountry(c)"
        class="w-full flex items-center gap-3 px-4 py-[10px] hover:bg-[#F5F5FF] transition-colors text-left"
        [class.bg-[#F1E2FB]]="c.iso === selected.iso">
        <span class="font-fredoka font-medium text-[13px] md:text-[15px] text-[#374151] flex-1 truncate">{{ c.name }}</span>
        <span class="font-fredoka font-semibold text-[13px] md:text-[15px] text-[#687AE4] shrink-0">{{ c.code }}</span>
        <svg *ngIf="c.iso === selected.iso" class="w-4 h-4 text-[#9333EA] shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
      </button>
    </div>
  </div>
</div>
