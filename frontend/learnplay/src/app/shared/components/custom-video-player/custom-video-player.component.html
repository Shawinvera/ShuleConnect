<div
  #videoPlayer
  class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden group"
  (keydown)="onKeyDown($event)"
  (mouseenter)="onMouseEnter()"
  (mousemove)="onMouseMove($event)"
  (mouseleave)="onMouseLeave()"
  tabindex="0"
>
  <!-- YouTube Player Container -->
  <div #playerContainer class="w-full h-full"></div>

  <!-- Bottom overlay - shows based on user interactions or when paused -->
  <div
    *ngIf="showTemporaryOverlays || isPaused"
    class="absolute bottom-0 left-0 right-0 bg-black z-25 pointer-events-none transition-opacity duration-300"
    [class.h-12]="!isFullscreen"
    [class.sm:h-16]="!isFullscreen"
    [class.md:h-20]="!isFullscreen"
    [class.h-16]="isFullscreen"
    [class.sm:h-20]="isFullscreen"
    [class.md:h-24]="isFullscreen"
    [class.lg:h-28]="isFullscreen"
  ></div>

  <!-- Pause overlay - only shows when paused, but doesn't cover controls -->
  <div
    *ngIf="isPaused && !hasEnded"
    class="absolute inset-0 bg-black/50 flex items-center justify-center z-30 cursor-pointer"
    [class.pb-12]="!isFullscreen"
    [class.sm:pb-16]="!isFullscreen"
    [class.md:pb-20]="!isFullscreen"
    [class.pb-16]="isFullscreen"
    [class.sm:pb-20]="isFullscreen"
    [class.md:pb-24]="isFullscreen"
    [class.lg:pb-28]="isFullscreen"
    (click)="togglePlayPause()"
  >
    <div
      class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center hover:bg-white/30 transition-all backdrop-blur-sm"
    >
      <svg class="w-8 h-8 text-white ml-1" fill="currentColor" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z" />
      </svg>
    </div>
  </div>

  <!-- Complete black overlay when video ends -->
  <div *ngIf="hasEnded" class="absolute inset-0 bg-black z-60 flex items-center justify-center">
    <button
      (click)="replay()"
      class="w-12 h-12 sm:w-16 sm:h-16 md:w-20 md:h-20 bg-white/20 rounded-full flex items-center justify-center hover:bg-white/30 transition-all backdrop-blur-sm"
      [class.-translate-y-6]="!isFullscreen"
      [class.sm:-translate-y-8]="!isFullscreen"
      [class.md:-translate-y-10]="!isFullscreen"
      [class.-translate-y-8]="isFullscreen"
      [class.sm:-translate-y-10]="isFullscreen"
      [class.md:-translate-y-12]="isFullscreen"
      [class.lg:-translate-y-14]="isFullscreen"
    >
      <svg
        class="w-6 h-6 sm:w-8 sm:h-8 md:w-10 md:h-10 text-white"
        fill="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"
        />
      </svg>
    </button>
  </div>

  <!-- Custom Controls - appear on hover, when paused, or when ended -->
  <div
    class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent p-3 sm:p-4 z-50 transition-opacity duration-300"
    [class.opacity-0]="isPlaying && !showControls && !isPaused"
    [class.opacity-100]="!isPlaying || showControls || hasEnded || isPaused"
    [class.group-hover:opacity-100]="isPlaying && !isPaused"
    (mouseenter)="showControlsTemporarily()"
    (mouseleave)="showControls = false"
  >
    <div class="flex items-center gap-2 sm:gap-4">
      <!-- Play/Pause Button -->
      <button
        (click)="togglePlayPause()"
        class="text-white hover:text-gray-300 transition-colors p-1"
        [disabled]="hasEnded"
      >
        <svg
          *ngIf="!isPlaying || hasEnded"
          class="w-5 h-5 sm:w-6 sm:h-6"
          fill="currentColor"
          viewBox="0 0 24 24"
        >
          <path d="M8 5v14l11-7z" />
        </svg>
        <svg
          *ngIf="isPlaying && !hasEnded"
          class="w-5 h-5 sm:w-6 sm:h-6"
          fill="currentColor"
          viewBox="0 0 24 24"
        >
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
        </svg>
      </button>

      <!-- Progress Bar -->
      <div
        class="flex-1 h-1 bg-white/30 rounded-full cursor-pointer relative group/progress"
        (click)="seekTo($event)"
      >
        <div
          class="h-full bg-white rounded-full transition-all duration-150"
          [style.width.%]="progress"
        ></div>
        <!-- Progress handle -->
        <div
          class="absolute top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full opacity-0 group-hover/progress:opacity-100 transition-opacity duration-150"
          [style.left.%]="progress"
          [style.transform]="'translateX(-50%) translateY(-50%)'"
        ></div>
      </div>

      <!-- VOLUME SECTION (New Position) -->
      <div class="flex items-center gap-1 group/volume relative">
        <button (click)="toggleMute()" class="text-white hover:text-gray-300 p-1">
          <mat-icon class="!w-5 !h-5 !text-[20px]">
            {{
              isMuted || currentVolume == 0
                ? 'volume_off'
                : currentVolume < 50
                  ? 'volume_down'
                  : 'volume_up'
            }}
          </mat-icon>
        </button>

        <!-- Volume Slider (Appears on hover of the volume icon) -->
        <div
          class="w-0 overflow-hidden group-hover/volume:w-20 transition-all duration-300 flex items-center"
        >
          <input
            type="range"
            min="0"
            max="100"
            [value]="isMuted ? 0 : currentVolume"
            (input)="setVolume($event)"
            class="w-full h-1 bg-white/30 rounded-full appearance-none cursor-pointer accent-white"
          />
        </div>
      </div>

      <!-- Time Display -->
      <span class="text-white text-xs sm:text-sm font-mono min-w-0 whitespace-nowrap">
        {{ formatTime(currentTime) }} / {{ formatTime(duration) }}
      </span>

      <!-- Fullscreen Button -->
      <button
        (click)="toggleFullscreen()"
        class="text-white hover:text-gray-300 transition-colors p-1"
      >
        <svg
          *ngIf="!isFullscreen"
          class="w-5 h-5 sm:w-6 sm:h-6"
          fill="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"
          />
        </svg>
        <svg
          *ngIf="isFullscreen"
          class="w-5 h-5 sm:w-6 sm:h-6"
          fill="currentColor"
          viewBox="0 0 24 24"
        >
          <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Click overlay for play/pause when playing -->
  <div
    *ngIf="isPlaying && !showControls"
    class="absolute inset-0 z-20 cursor-pointer"
    (click)="togglePlayPause()"
  ></div>
</div>
