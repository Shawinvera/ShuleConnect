<app-toast [message]="toast.message" [type]="toast.type" [visible]="toast.visible" (dismissed)="toast.dismiss()"></app-toast>
<div class="min-h-screen bg-[#F3F4F8] font-sans pt-2 px-[12px] md:pt-4 md:px-[40px] xl:px-[150px] pb-[80px] md:pb-10 text-slate-800">

    <!-- Header Section -->
    <div class="mb-6">
      <app-teacher-breadcrumb></app-teacher-breadcrumb>

      <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-12">
        <div>
          <h1 class="font-[Fredoka] font-bold text-[30px] md:text-[50px] leading-[44px] md:leading-[64px] tracking-[-0.4px] text-[#374151] mb-3">Manage Grades</h1>
          <p class="font-[Fredoka] font-normal text-[14px] md:text-[24px] leading-[28px] md:leading-[39px] tracking-[-0.4px] text-[#374151]">Create grade levels (e.g., Grade 1, Grade 2)</p>
        </div>

        <!-- Add Button -->
        <button 
          (click)="toggleForm()"
          class="w-full md:w-[268px] h-[83px] text-white rounded-[20px] shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-[4px] opacity-100"
          style="background: linear-gradient(90deg, #4ADE80 0%, #687AE4 100%); font-family: 'Fredoka'; font-weight: 600; font-size: 28px; line-height: 43px; letter-spacing: -0.4px; text-align: center; vertical-align: middle;"
        >
          <span class="text-lg" *ngIf="!isFormOpen">+</span> 
          <span class="text-lg" *ngIf="isFormOpen">×</span>
          {{ isFormOpen ? 'Close Form' : 'Add Grade' }}
        </button>
      </div>
    </div>

    <!-- Form Section -->
    <div *ngIf="isFormOpen" class="bg-white shadow-sm border-[5px] border-[#4ADE80] px-4 sm:px-6 py-6 sm:py-[51px] rounded-[23px] space-y-6 mb-6">
      <h2 class="font-[Fredoka] font-semibold text-[40px] leading-[40px] tracking-[-0.4px] text-left text-[#374151]">{{ editingGradeId ? 'Edit Grade Level' : 'Add New Grade Level' }}</h2>

      <form [formGroup]="gradeForm" (ngSubmit)="saveGrade()">
        <div class="space-y-6">
          <!-- Grade Name -->
          <div>
            <label class="block font-[Fredoka] font-semibold text-[25px] leading-[20px] tracking-[-0.4px] text-[#374151] mb-2">Grade Name *</label>
            <input type="text" placeholder="e.g Grade 1" formControlName="name"
              class="mt-[10px] w-full h-[79px] bg-white border-gray-200 border-[2px] rounded-[20px] px-[20px] py-[25px] font-fredoka font-normal text-[23px] leading-[29px] tracking-[-0.4px] text-[#374151] placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <!-- Description -->
          <div>
            <label class="block font-[Fredoka] font-semibold text-[25px] leading-[20px] tracking-[-0.4px] text-[#374151] mb-2">Description</label>
            <textarea placeholder="Brief description..." formControlName="description" rows="3"
              class="mt-[10px] w-full bg-white border-gray-200 border-[2px] rounded-[20px] px-[20px] py-[25px] font-fredoka font-normal text-[23px] leading-[29px] tracking-[-0.4px] text-[#374151] placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"></textarea>
          </div>
        </div>

        <!-- Buttons -->
        <div class="flex flex-col sm:flex-row gap-3 mt-4">
          <button type="submit" 
            [disabled]="!gradeForm.valid || (editingGradeId && !gradeForm.dirty)"
            [class.opacity-50]="!gradeForm.valid || (editingGradeId && !gradeForm.dirty)"
            [class.cursor-not-allowed]="editingGradeId && !gradeForm.dirty"
            class="font-[Fredoka] bg-[#22c55e] hover:bg-green-600 text-white font-bold py-2 px-6 rounded-lg transition-colors">
            {{ editingGradeId ? 'Update Grade' : 'Save Grade' }}
          </button>
          <button type="button" (click)="cancel()" class="font-[Fredoka] bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-6 rounded-lg transition-colors">
            Cancel
          </button>
        </div>
      </form>
    </div>

    <!-- Grades Grid -->
    <div class="">
      <app-spinner-overlay *ngIf="isLoading" [inline]="true"></app-spinner-overlay>
      <div *ngIf="!isLoading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div *ngFor="let grade of grades"
             (click)="selectGrade(grade)"
             class="bg-white shadow-[0_4px_16px_rgba(0,0,0,0.10)] border border-slate-200 rounded-[23px] p-[30px] hover:shadow-[0_8px_24px_rgba(0,0,0,0.15)] hover:-translate-y-1 transition-all duration-300 text-left w-full flex flex-col cursor-pointer"
             style="outline: none !important;">

          <!-- Icon -->
          <div class="mb-6 w-16 h-16 flex items-center justify-center">
            <img src="assets/icons/graduand.png" alt="Graduation Hat" class="w-full h-full object-contain" />
          </div>

          <!-- Content -->
          <h3 class="font-[Fredoka] font-bold text-[30px] leading-[50px] tracking-[-0.4px] text-left text-[#374151] mb-2">{{ grade.name }}</h3>
          <p class="font-[Fredoka] font-normal text-[14px] leading-[24px] tracking-[-0.4px] text-left text-[#374151] mb-8">{{ grade.description }}</p>

          <!-- Action Buttons -->
          <div class="flex gap-2 mt-auto" (click)="$event.stopPropagation()">
            <button (click)="editGrade(grade)"
              class="action-btn bg-[#8B5CF6] hover:bg-[#7C3AED] text-white p-2.5 rounded-lg transition-all duration-200 hover:scale-105 hover:shadow-lg flex items-center justify-center"
              title="Edit Grade">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
              </svg>
            </button>
            <button (click)="deleteGrade(grade)"
              class="action-btn bg-[#EF4444] hover:bg-[#DC2626] text-white p-2.5 rounded-lg transition-all duration-200 hover:scale-105 hover:shadow-lg flex items-center justify-center"
              title="Delete Grade">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Next Step Section -->
    <div class="mt-8 bg-[#DCF9EA] border border-[#4ADE80] px-4 sm:px-[30px] py-6 sm:py-[35px] rounded-[23px] flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <div>
        <h3 class="font-[Fredoka] font-bold text-[35px] leading-[40px] tracking-[-0.4px] text-[#374151]">Next: Create Subjects</h3>
        <p class="font-[Fredoka] font-normal text-[22px] leading-[39px] tracking-[-0.4px] text-[#374151] text-sm mt-1">After creating grades, create subjects that can be assigned to them</p>
      </div>
      <button (click)="nextStep()" class="w-[268px] h-[83px] text-white rounded-[20px] shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-[10px] opacity-100" style="background: linear-gradient(90deg, #4ADE80 0%, #687AE4 100%); font-family: 'Fredoka'; font-weight: 600; font-size: 28px; line-height: 43px; letter-spacing: -0.4px; text-align: center; vertical-align: middle;">
        Next Step
      </button>
    </div>

</div>
