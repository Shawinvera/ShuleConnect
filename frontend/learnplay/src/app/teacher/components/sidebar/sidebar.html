
<aside
  class="sidebar-container hidden md:flex fixed left-0 z-[999] flex-col py-6 transition-all duration-300 overflow-y-auto overflow-x-hidden"
  [style.width]="isExpanded ? '220px' : '68px'">

  <div class="flex px-3 mb-4" [class.justify-end]="isExpanded" [class.justify-center]="!isExpanded">
    <button (click)="toggle()" class="text-white/70 hover:text-white transition-colors">
      <ng-container *ngIf="isExpanded">
        <span class="text-lg leading-none">✕</span>
      </ng-container>
      <ng-container *ngIf="!isExpanded">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </ng-container>
    </button>
  </div>

  <div class="mx-3 border-t border-white/15 mb-3"></div>

 
  <nav class="flex flex-col gap-1 px-2 flex-1">

    
    <button (click)="navigate('/courses')"
      class="flex items-center gap-3 px-2 py-[10px] rounded-xl transition-all duration-200 text-left w-full"
      [style.background]="isActive('/courses') ? 'rgba(255,255,255,0.12)' : 'transparent'">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
        [style.background]="isActive('/courses') ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.08)'">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
      </div>
      <span *ngIf="isExpanded" class="font-[Fredoka] font-semibold text-[16px] text-white whitespace-nowrap">Home</span>
    </button>

   
    <ng-container *ngIf="currentPage === 'dashboard'">
      <!-- Manage Grades -->
      <button (click)="navigateWithCourse('grades')"
        class="flex items-center gap-3 px-2 py-[10px] rounded-xl transition-all duration-200 text-left w-full"
        [style.background]="isActive('/courses/grades') ? 'rgba(255,255,255,0.12)' : 'transparent'">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
          [style.background]="isActive('/courses/grades') ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.08)'">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
          </svg>
        </div>
        <span *ngIf="isExpanded" class="font-[Fredoka] font-semibold text-[16px] text-white whitespace-nowrap">Manage
          Grades</span>
      </button>

      <button (click)="navigateWithCourse('subjects')"
        class="flex items-center gap-3 px-2 py-[10px] rounded-xl transition-all duration-200 text-left w-full"
        [style.background]="isActive('/courses/subjects') ? 'rgba(255,255,255,0.12)' : 'transparent'">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
          [style.background]="isActive('/courses/subjects') ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.08)'">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
        </div>
        <span *ngIf="isExpanded" class="font-[Fredoka] font-semibold text-[16px] text-white whitespace-nowrap">Manage
          Subjects</span>
      </button>

      <button (click)="navigateWithCourse('content')"
        class="flex items-center gap-3 px-2 py-[10px] rounded-xl transition-all duration-200 text-left w-full"
        [style.background]="isActive('/courses/content') ? 'rgba(255,255,255,0.12)' : 'transparent'">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
          [style.background]="isActive('/courses/content') ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.08)'">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h18M3 12h18M3 17h18" />
          </svg>
        </div>
        <span *ngIf="isExpanded" class="font-[Fredoka] font-semibold text-[16px] text-white whitespace-nowrap">Grade
          Structure</span>
      </button>

    
      <button (click)="navigate('/courses/exams')"
        class="flex items-center gap-3 px-2 py-[10px] rounded-xl transition-all duration-200 text-left w-full"
        [style.background]="isActive('/courses/exams') ? 'rgba(255,255,255,0.12)' : 'transparent'">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
          [style.background]="isActive('/courses/exams') ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.08)'">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
          </svg>
        </div>
        <span *ngIf="isExpanded" class="font-[Fredoka] font-semibold text-[16px] text-white whitespace-nowrap">Manage
          Exams</span>
      </button>

      <button (click)="navigateWithCourse('subscription_plan')"
        class="flex items-center gap-3 px-2 py-[10px] rounded-xl transition-all duration-200 text-left w-full"
        [style.background]="isActive('/courses/subscription_plan') ? 'rgba(255,255,255,0.12)' : 'transparent'">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
          [style.background]="isActive('/courses/subscription_plan') ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.08)'">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
          </svg>
        </div>
        <span *ngIf="isExpanded"
          class="font-[Fredoka] font-semibold text-[16px] text-white whitespace-nowrap">Subscription Plan</span>
      </button>

      <!-- Analytics -->
      <button (click)="navigate('/courses/analytics')"
        class="flex items-center gap-3 px-2 py-[10px] rounded-xl transition-all duration-200 text-left w-full"
        [style.background]="isActive('/courses/analytics') ? 'rgba(255,255,255,0.12)' : 'transparent'">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
          [style.background]="isActive('/courses/analytics') ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.08)'">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
        </div>
        <span *ngIf="isExpanded"
          class="font-[Fredoka] font-semibold text-[16px] text-white whitespace-nowrap">Analytics</span>
      </button>
    </ng-container>

  </nav>

  

  <p *ngIf="isExpanded" class="font-[Fredoka] text-[11px] text-white/30 text-center mb-3 whitespace-nowrap"></p>

  <div class="mx-3 border-t border-white/15 mb-3"></div>

  <!-- Settings -->
  <div class="flex flex-col gap-1 px-2">
    <button (click)="navigate('/courses/settings')"
      class="flex items-center gap-3 px-2 py-[10px] rounded-xl hover:bg-white/10 transition-all duration-200 text-left w-full">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
        style="background: rgba(255,255,255,0.08)">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white/70" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
      <span *ngIf="isExpanded"
        class="font-[Fredoka] font-semibold text-[16px] text-white whitespace-nowrap">Settings</span>
    </button>

  
    <button (click)="onLogout()"
      class="logout-button flex items-center gap-3 px-3 py-3 rounded-xl transition-all duration-200 text-left w-full mt-2 border border-red-400/30">
      <div
        class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 bg-gradient-to-br from-red-500 to-red-600 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
      </div>
      <span *ngIf="isExpanded"
        class="font-[Fredoka] font-semibold text-[16px] text-white whitespace-nowrap">Logout</span>
    </button>
  </div>

</aside>
