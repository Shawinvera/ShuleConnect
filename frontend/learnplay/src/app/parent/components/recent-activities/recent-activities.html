<!-- Navbar: kid dashboard navbar when from=kid, parent navbar otherwise -->
<app-navbar *ngIf="isFromKid"></app-navbar>
<app-parent-navbar *ngIf="!isFromKid"></app-parent-navbar>

<main class="bg-gray-50 min-h-screen pb-[80px] md:pb-[60px]">
  <div class="pt-[10px] md:pt-[25px] px-[16px] sm:px-[50px] md:px-[50px] xl:px-[150px]">
    <div class="mb-4 md:mb-8 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button
          (click)="goBack()"
          class="flex items-center justify-center w-[36px] h-[36px] md:w-[40px] md:h-[40px] rounded-full bg-white shadow-[0_2px_8px_rgba(0,0,0,0.1)] hover:bg-gray-50 transition-colors cursor-pointer flex-shrink-0"
          aria-label="Go back"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667DE8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <!-- Breadcrumb: kid context -->
        <ng-container *ngIf="isFromKid">
          <ol class="flex items-center gap-1 font-fredoka text-[13px] md:text-[16px]">
            <li (click)="goBack()" class="text-[#667DE8] cursor-pointer hover:underline">Dashboard</li>
            <li class="text-[#9CA3AF]">›</li>
            <li class="text-[#374151] font-semibold">Recent Activities</li>
          </ol>
        </ng-container>
        <!-- Breadcrumb: parent context -->
        <ng-container *ngIf="!isFromKid">
          <ol class="flex items-center gap-1 font-fredoka text-[13px] md:text-[16px]">
            <li (click)="goToDashboard()" class="text-[#667DE8] cursor-pointer hover:underline">Dashboard</li>
            <li class="text-[#9CA3AF]">›</li>
            <li (click)="goToChildDetails()" class="text-[#667DE8] cursor-pointer hover:underline">{{ childName }}</li>
            <li class="text-[#9CA3AF]">›</li>
            <li class="text-[#374151] font-semibold">Recent Activities</li>
          </ol>
        </ng-container>
      </div>
    </div>

    <h2 class="text-[#374151] font-fredoka font-semibold text-[24px] md:text-[40px] mb-4 md:mb-6">
      {{ childName }}'s Recent Activities
    </h2>

    <app-spinner-overlay *ngIf="isLoading" [inline]="true"></app-spinner-overlay>

    <div *ngIf="!isLoading && activities.length > 0" class="space-y-3 md:space-y-4">
      <div *ngFor="let activity of activities"
           class="flex items-center justify-between gap-3 md:gap-5 p-4 md:p-6 bg-white rounded-[15px] md:rounded-[23px] shadow-[0_6px_30px_0_rgba(0,0,0,0.08)] border border-gray-100">
        <div class="flex items-center gap-3 md:gap-4">
          <div class="w-[46px] h-[46px] md:w-[72px] md:h-[72px] bg-[#C999F5] rounded-[8px] md:rounded-[12px] flex items-center justify-center flex-shrink-0">
            <img src="assets/icons/trophy.png" class="w-[28px] h-[28px] md:w-[50px] md:h-[50px]" alt="trophy">
          </div>
          <div>
            <h4 class="text-[#9333EA] font-fredoka font-bold text-[15px] md:text-[28px] leading-tight">{{ activity.title }}</h4>
            <p class="text-[#374151] font-fredoka font-normal text-[12px] md:text-[20px]">{{ activity.description }}</p>
          </div>
        </div>
        <div class="flex items-center gap-1 mr-1 flex-shrink-0">
          <span class="text-[#CA8A04] font-fredoka font-bold text-[15px] md:text-[22px]">+{{ activity.points }}</span>
          <img src="assets/icons/star_parent_dashboard.png" class="w-[18px] h-[18px] md:w-[30px] md:h-[30px]">
        </div>
      </div>
    </div>

    <div *ngIf="!isLoading && activities.length === 0" class="flex flex-col items-center justify-center py-16 gap-4">
      <div class="w-[70px] h-[70px] bg-gray-100 rounded-full flex items-center justify-center">
        <mat-icon class="text-gray-400 text-[36px]">history</mat-icon>
      </div>
      <p class="font-fredoka font-normal text-[18px] text-[#374151]">No recent activity yet</p>
    </div>
  </div>
</main>
