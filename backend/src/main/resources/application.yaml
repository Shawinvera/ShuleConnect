server:
  port: ${PORT:8112}
  servlet:
    context-path: /api

spring.jmx.default-domain: shuleconnect

app:
  jwt:
    secret: ${JWT_SECRET:Oz6b/lnE13gIibROom1kpLeGe0APAYOs3SGcGJKp8zg=}
    access-expiration: 604800000
    refresh-expiration: 604800000

wazi:
  frontend-dashboard-url: ${FRONTEND_DASHBOARD_URL:https://shule-connect-learnplay.vercel.app}
  backend-base-url: ${BACKEND_BASE_URL:https://shuleconnect-1.onrender.com/api}

spring:
  application:
    name: shuleconnect
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  config:
    import: optional:file:.env

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shuleconnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Nairobi}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:#Vera2003}
  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "http://localhost:8112/api/login/oauth2/code/google"
            scope:
              - email
              - profile

          microsoft:
            provider: microsoft
            client-id: MICROSOFT_CLIENT_ID
            client-secret: MICROSOFT_SECRET
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - openid
              - profile
              - email

          apple:
            client-id: APPLE_CLIENT_ID
            client-secret: APPLE_SECRET
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - name
              - email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
          microsoft:
            authorization-uri: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/common/oauth2/v2.0/token
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub

          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token

